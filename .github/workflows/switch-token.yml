# Saves the Nap Switch's token for every device. The switch page presses this for you when you choose
# "Save for all my devices". It receives only the token already locked with the switch password
# (AES-GCM, never the token itself), checks that shape strictly, and writes switch/sealed.json on main.
name: Save switch token
on:
  workflow_dispatch:
    inputs:
      sealed:
        description: "The locked token from the Nap Switch page. Use the page's button instead of running this by hand."
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: testing-time
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    env:
      SEALED: ${{ inputs.sealed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the locked token and write switch/sealed.json
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          try:
              s = json.loads(os.environ.get("SEALED", ""))
          except Exception:
              sys.exit("Not a locked token from the Nap Switch page. Use its Save for all my devices button.")
          ok = (isinstance(s, dict) and set(s) == {"v", "iv", "ct"} and type(s["v"]) is int and s["v"] == 1
                and isinstance(s["iv"], str) and re.fullmatch(r"[0-9a-f]{24}", s["iv"]) is not None
                and isinstance(s["ct"], str) and re.fullmatch(r"[0-9a-f]{64,600}", s["ct"]) is not None)
          if not ok:
              sys.exit("Not a locked token from the Nap Switch page. Use its Save for all my devices button.")
          os.makedirs("switch", exist_ok=True)
          with open("switch/sealed.json", "w") as f:
              json.dump({"v": 1, "iv": s["iv"], "ct": s["ct"]}, f, indent=2)
              f.write("\n")
          PY
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add switch/sealed.json
          if git diff --cached --quiet; then echo "This locked token is already saved."; exit 0; fi
          git commit -m "Nap Switch: save the locked token for every device"
          git pull --rebase
          git push
