<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reef dive · OPAL Lab Bench</title>
<meta name="description" content="A slow 3D drift over a coral reef, for a few quiet minutes away from the Lab Bench.">
<meta name="theme-color" content="#0b5b86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Reef dive: a first-person 3D drift over a reef. One page plus the three.js library kept in vendor/ on this site.
   Like the swim break, it has no Testing time lock, so it stays open while the benches nap. */
:root{ --navy:#2B215A; --pill:rgba(8,32,60,.58); --pill-line:rgba(255,255,255,.28); --gold:#FFC94D; --sheet:rgba(7,28,56,.93); }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0b5b86;color:#fff;font-family:"Poppins","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(2,18,40,0) 52%,rgba(2,18,40,.5) 100%)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hud{position:fixed;z-index:2;display:flex;gap:8px;align-items:center;pointer-events:none;transition:opacity 1.2s}
.hud>*{pointer-events:auto}
body.calm .hud{opacity:.16}
body.calm .hud:hover,body.calm .hud:focus-within{opacity:1}
.tl{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
.tr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
.br{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
.bl{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}
.pill{min-height:44px;padding:0 15px;border-radius:999px;background:var(--pill);border:1px solid var(--pill-line);color:#fff;font:600 .92rem/1 "Poppins","Trebuchet MS",system-ui,sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:7px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap;-webkit-user-select:none;user-select:none}
button.pill{cursor:pointer}
.pill:hover{background:rgba(8,32,60,.82)}
.pill[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
.depth{font-variant-numeric:tabular-nums;min-width:112px;justify-content:center;pointer-events:none}
.hint{position:fixed;z-index:2;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,560px);text-align:center;font-weight:600;font-size:.95rem;line-height:1.35;padding:10px 18px;border-radius:16px;background:var(--pill);border:1px solid var(--pill-line);transition:opacity 1s;pointer-events:none}
.hint.gone{opacity:0}
.pacer{position:fixed;z-index:2;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 84px));transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:none;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,20,50,.7)}
.pacer i{display:block;width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(140,235,245,.2);transform:scale(.55)}
.gate{position:fixed;z-index:6;inset:0;display:grid;place-items:center;padding:20px;background:rgba(4,24,52,.6)}
.gate div{max-width:460px;background:var(--sheet);border:1px solid var(--pill-line);border-radius:18px;padding:22px;text-align:center}
.gate h1{margin:0 0 8px;font-size:1.5rem;font-weight:800}
.gate p{margin:0 0 16px;font-weight:500;line-height:1.45;color:#d7e9ff}
.gate .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0}
.gate .go{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.loading{position:fixed;z-index:4;inset:0;display:grid;place-items:center;background:#0b5b86;font-weight:700;font-size:1.1rem;transition:opacity .9s}
.loading.gone{opacity:0;pointer-events:none}
@media (max-width:560px){ .pill{padding:0 11px;font-size:.84rem;gap:5px} .pill .long{display:none} .hud{gap:6px} .hint{bottom:max(70px,calc(env(safe-area-inset-bottom) + 70px));font-size:.9rem} .depth{min-width:100px} }
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="A slow first-person drift over a sunlit coral reef, with schools of tropical fish, a sea turtle, a manta ray and jellyfish."></canvas>
<div class="shade" aria-hidden="true"></div>

<div class="hud tl"><a class="pill" href="../" id="back"><span aria-hidden="true">←</span> Lab Bench</a><a class="pill" href="../swim/"><span>Swim<span class="long"> game</span></span></a></div>
<div class="hud tr">
  <button class="pill" id="btnBreathe" aria-pressed="false"><span>Breathe<span class="long"> with me</span></span></button>
  <button class="pill" id="btnSound" aria-pressed="false">Sound</button>
</div>
<div class="hud bl"><span class="pill depth" id="depth">Depth 0 m</span></div>
<div class="hud br"><button class="pill" id="btnHover" aria-pressed="false">Hover</button><button class="pill" id="btnSwim">Hold to swim</button></div>
<p class="hint" id="hint">Drag to look around. Hold the up arrow to swim faster, or just drift.</p>
<div class="pacer" id="pacer" hidden aria-hidden="true"><i id="ring"></i><span id="pacerTxt">Breathe in</span></div>
<div class="loading" id="loading" role="status">Descending…</div>

<div class="gate" id="gate" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="gateT">
    <h1 id="gateT">Reef dive</h1>
    <p id="gateP">This page moves: the view drifts slowly over a reef while fish swim past. Your device asks for less motion, so it is paused until you choose.</p>
    <p class="row"><button class="pill go" id="btnDive">Dive in</button><a class="pill" href="../swim/">Swim game</a><a class="pill" href="../">Lab Bench</a></p>
  </div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=id=>document.getElementById(id), TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t) };
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
const R=mulberry(20261115), rand=(a,b)=>a+(b-a)*R(), pick=a=>a[(R()*a.length)|0];

/* ---------- noise ---------- */
const P=new Uint8Array(512); { const p=[...Array(256).keys()]; for(let i=255;i>0;i--){ const j=(R()*(i+1))|0; [p[i],p[j]]=[p[j],p[i]] } for(let i=0;i<512;i++) P[i]=p[i&255] }
const fade=t=>t*t*(3-2*t);
function n2(x,y){ const ix=Math.floor(x), iy=Math.floor(y), u=fade(x-ix), v=fade(y-iy), h=(a,b)=>P[(P[a&255]+b)&255]/255; const a=h(ix,iy), b=h(ix+1,iy), c=h(ix,iy+1), d=h(ix+1,iy+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v }
function fbm2(x,y,o=4){ let s=0,a=.5,f=1; for(let i=0;i<o;i++){ s+=a*n2(x*f,y*f); a*=.5; f*=2.03 } return s }
function n3(x,y,z){ const ix=Math.floor(x), iy=Math.floor(y), iz=Math.floor(z), u=fade(x-ix), v=fade(y-iy), w=fade(z-iz), h=(a,b,c)=>P[(P[(P[a&255]+b)&255]+c)&255]/255;
  const x00=lerp(h(ix,iy,iz),h(ix+1,iy,iz),u), x10=lerp(h(ix,iy+1,iz),h(ix+1,iy+1,iz),u), x01=lerp(h(ix,iy,iz+1),h(ix+1,iy,iz+1),u), x11=lerp(h(ix,iy+1,iz+1),h(ix+1,iy+1,iz+1),u);
  return lerp(lerp(x00,x10,v),lerp(x01,x11,v),w) }
function fbm3(x,y,z,o=3){ let s=0,a=.5,f=1; for(let i=0;i<o;i++){ s+=a*n3(x*f,y*f,z*f); a*=.5; f*=2.03 } return s }

/* ---------- the dive site: a loop path past a string of coral heads ---------- */
const NCP=44, ctrl=[], sites=[];
for(let i=0;i<NCP;i++){ const a=i/NCP*TAU, r=58+10*Math.sin(a*3+1)+6*Math.sin(a*5+2.3); ctrl.push({a,x:Math.cos(a)*r,z:Math.sin(a)*r}) }
for(let i=0;i<NCP;i+=2){ const c=ctrl[i], side=(i/2)%2?1:-1, r=rand(5,7.5), off=r*.72+2.3, rx=Math.cos(c.a), rz=Math.sin(c.a); sites.push({x:c.x+rx*side*off,z:c.z+rz*side*off,r,h:rand(1.2,2.2),i}) }
function groundY(x,z){ let y=-13.5+(fbm2(x*.018+10,z*.018+10,4)-.5)*5; for(const s of sites){ const d2=(x-s.x)**2+(z-s.z)**2; y+=s.h*Math.exp(-d2/(s.r*s.r)) } return y }
const ASC_A=4.1;                                           // around this angle the path rises toward the surface
{ const ys=ctrl.map(c=>{ let m=-99; for(let k=0;k<8;k++){ const b=k/8*TAU; m=Math.max(m,groundY(c.x+Math.cos(b)*3,c.z+Math.sin(b)*3)) } return Math.max(m,groundY(c.x,c.z))+1.75 });
  for(let pass=0;pass<2;pass++){ const o=ys.slice(); for(let i=0;i<NCP;i++) ys[i]=(o[(i+NCP-1)%NCP]+o[i]*2+o[(i+1)%NCP])/4 }
  ctrl.forEach((c,i)=>{ let da=Math.abs(c.a-ASC_A); const k=smooth(.95,.25,da); c.y=lerp(ys[i],-6.4,k) }) }
const curve=new THREE.CatmullRomCurve3(ctrl.map(c=>new THREE.Vector3(c.x,c.y,c.z)),true,'catmullrom',.5);
const PATH_LEN=curve.getLength(), pathPts=curve.getSpacedPoints(480);
function pathDist(x,z){ let m=1e9; for(let i=0;i<pathPts.length;i+=2){ const p=pathPts[i], d=(p.x-x)**2+(p.z-z)**2; if(d<m) m=d } return Math.sqrt(m) }
function siteNear(x,z){ let m=0; for(const s of sites){ const d=Math.hypot(x-s.x,z-s.z); m=Math.max(m,1-d/(s.r*1.7)) } return clamp(m,0,1) }

/* ---------- renderer ---------- */
const canvas=$('gl');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}) }catch(e){ renderer=null }
if(!renderer){ $('loading').classList.add('gone'); $('gateP').textContent='This device or browser could not start 3D graphics, so the reef dive cannot run here. The swim game works without it.'; $('btnDive').hidden=true; $('gate').hidden=false; throw new Error('no webgl') }
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
let pr=Math.min(window.devicePixelRatio||1,1.5);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(62,1,.15,130);
camera.rotation.order='YXZ';
function resize(){ const w=window.innerWidth, h=window.innerHeight; renderer.setPixelRatio(pr); renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=h>w?74:62; camera.updateProjectionMatrix() }

/* ---------- water: shared uniforms and shader pieces ---------- */
const SUN=new THREE.Vector3(.32,1,.2).normalize();
const U={ uTime:{value:0}, uExt:{value:new THREE.Vector3(.052,.024,.018)}, uDeep:{value:new THREE.Color(0x04354f)}, uMid:{value:new THREE.Color(0x128fb6)}, uTop:{value:new THREE.Color(0x7fe6f0)}, uSun:{value:SUN}, uCaus:{value:1}, uCam:{value:new THREE.Vector3()} };
const WATER=`
uniform float uTime; uniform vec3 uExt; uniform vec3 uDeep; uniform vec3 uMid; uniform vec3 uTop; uniform vec3 uSun; uniform float uCaus;
vec3 waterColor(vec3 d){ vec3 c=mix(uDeep,uMid,smoothstep(-.95,.06,d.y)); return mix(c,uTop,smoothstep(.02,.95,d.y)); }
vec2 h22(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float vedge(vec2 x,float t){ vec2 n=floor(x), f=fract(x); float f1=8., f2=8.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(float(i),float(j)); vec2 o=.5+.42*sin(t+6.2831*h22(n+g)); vec2 r=g+o-f; float d=dot(r,r); if(d<f1){ f2=f1; f1=d; } else if(d<f2){ f2=d; } }
  return sqrt(f2)-sqrt(f1); }
float caustic(vec2 p,float t){ float a=vedge(p,t*.9), b=vedge(p*1.37+vec2(3.1,1.7),t*1.2+2.);
  return pow(1.-smoothstep(0.,.5,a),3.)*.65+pow(1.-smoothstep(0.,.45,b),3.)*.5; }
`;
const UW_FRAG=`
{ vec3 upV=normalize((viewMatrix*vec4(0.,1.,0.,0.)).xyz); float upf=clamp(dot(normal,upV)*.6+.5,0.,1.);
  float df=clamp(1.+vWPos.y/34.,.12,1.);
  vec2 cp=vWPos.xz-uSun.xz/uSun.y*vWPos.y;
  float c=caustic(cp*.42,uTime);
  gl_FragColor.rgb*=1.+uCaus*upf*upf*df*(c*2.3-.42);
  vec3 vd=normalize(vWPos-cameraPosition); vec3 tr=exp(-vVD*uExt);
  gl_FragColor.rgb=gl_FragColor.rgb*tr+waterColor(vd)*(1.-tr); }
`;
/* Give a standard material sunlight caustics and the colour loss of distance under water. */
function uw(mat,o={}){
  mat.onBeforeCompile=sh=>{ Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWPos; varying float vVD; uniform float uTime;\n'+(o.vpars||''))
      .replace('#include <begin_vertex>','#include <begin_vertex>\n'+(o.vmain||''))
      .replace('#include <project_vertex>','#include <project_vertex>\n vec4 wp4=vec4(transformed,1.);\n#ifdef USE_INSTANCING\n wp4=instanceMatrix*wp4;\n#endif\n vWPos=(modelMatrix*wp4).xyz; vVD=-mvPosition.z;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWPos; varying float vVD;\n'+WATER)
      .replace('#include <tonemapping_fragment>',UW_FRAG+'\n#include <tonemapping_fragment>') };
  mat.customProgramCacheKey=()=>'uw-'+(o.key||'plain'); return mat }

/* ---------- textures drawn on the spot ---------- */
function canvasTex(w,h,draw,o={}){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=o.data?THREE.NoColorSpace:THREE.SRGBColorSpace; if(o.repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(o.repeat,o.repeat) } t.anisotropy=4; return t }
function tileNoise(S,f,lo,hi){ return (g)=>{ const im=g.createImageData(S,S), d=im.data, N=(x,y)=>fbm2(x*f/S+31,y*f/S+17,4);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){ const v=(N(x,y)*(S-x)*(S-y)+N(x-S,y)*x*(S-y)+N(x-S,y-S)*x*y+N(x,y-S)*(S-x)*y)/(S*S), c=clamp(lerp(lo,hi,(v-.25)*2),0,255), i=(y*S+x)*4; d[i]=d[i+1]=d[i+2]=c; d[i+3]=255 } g.putImageData(im,0,0) } }
const detailTex=(rep)=>canvasTex(256,256,tileNoise(256,9,150,255),{repeat:rep});
const rippleTex=canvasTex(256,256,(g,S)=>{ const im=g.createImageData(S,S), d=im.data; for(let y=0;y<S;y++) for(let x=0;x<S;x++){ const u=x/S, v=y/S, h=.5+.5*Math.sin(TAU*(7*v+.55*Math.sin(TAU*u*2)+.3*Math.sin(TAU*(u*3+v)))), c=255*h, i=(y*S+x)*4; d[i]=d[i+1]=d[i+2]=c; d[i+3]=255 } g.putImageData(im,0,0) },{data:true,repeat:70});
const brainTex=canvasTex(256,256,(g,S)=>{ g.fillStyle='#fff'; g.fillRect(0,0,S,S); g.strokeStyle='rgba(60,40,30,.55)'; g.lineWidth=5; g.lineCap='round'; for(let r=0;r<16;r++){ g.beginPath(); for(let x=-8;x<=S+8;x+=4){ const y=r*16+8+6*Math.sin(TAU*(x/S*3+r*.37))+4*Math.sin(TAU*(x/S*7+r*.61)); x<0?g.moveTo(x,y):g.lineTo(x,y) } g.stroke() } },{repeat:2});
const fanTex=canvasTex(256,256,(g,S)=>{ g.strokeStyle='#fff'; g.lineCap='round'; (function br(x,y,a,len,wd,d){ a=clamp(a,-2.65,-.49); const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len; g.lineWidth=wd; g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke(); if(d>0){ const n=d>3?3:2; for(let i=0;i<n;i++) br(x2,y2,a+rand(-.5,.5),len*rand(.72,.86),Math.max(1.6,wd*.72),d-1) } })(S/2,S-2,-Math.PI/2,44,10,7) });

/* ---------- small geometry helpers ---------- */
function mergeGeos(list){ let nv=0, ni=0; for(const g of list){ nv+=g.attributes.position.count; ni+=g.index?g.index.count:g.attributes.position.count }
  const pos=new Float32Array(nv*3), nor=new Float32Array(nv*3), col=new Float32Array(nv*3), uv=new Float32Array(nv*2), idx=new Uint32Array(ni); let vo=0, io=0;
  for(const g of list){ const p=g.attributes.position, n=g.attributes.normal, c=g.attributes.color, u=g.attributes.uv; pos.set(p.array,vo*3); if(n) nor.set(n.array,vo*3); if(c) col.set(c.array,vo*3); else col.fill(1,vo*3,(vo+p.count)*3); if(u) uv.set(u.array,vo*2);
    if(g.index){ for(let i=0;i<g.index.count;i++) idx[io++]=g.index.array[i]+vo } else { for(let i=0;i<p.count;i++) idx[io++]=i+vo } vo+=p.count }
  const out=new THREE.BufferGeometry(); out.setAttribute('position',new THREE.BufferAttribute(pos,3)); out.setAttribute('normal',new THREE.BufferAttribute(nor,3)); out.setAttribute('color',new THREE.BufferAttribute(col,3)); out.setAttribute('uv',new THREE.BufferAttribute(uv,2)); out.setIndex(new THREE.BufferAttribute(idx,1)); return out }
function paint(geo,fn){ const p=geo.attributes.position, n=geo.attributes.normal, c=new Float32Array(p.count*3), col=new THREE.Color(); for(let i=0;i<p.count;i++){ fn(col,p.getX(i),p.getY(i),p.getZ(i),n?n.getY(i):0); c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b } geo.setAttribute('color',new THREE.BufferAttribute(c,3)); return geo }
function smoothNormals(g){ g.computeVertexNormals(); const p=g.attributes.position, n=g.attributes.normal, acc=new Map(), key=i=>Math.round(p.getX(i)*400)+'_'+Math.round(p.getY(i)*400)+'_'+Math.round(p.getZ(i)*400);
  for(let i=0;i<p.count;i++){ const k=key(i), a=acc.get(k)||[0,0,0]; a[0]+=n.getX(i); a[1]+=n.getY(i); a[2]+=n.getZ(i); acc.set(k,a) }
  for(let i=0;i<p.count;i++){ const a=acc.get(key(i)), l=Math.hypot(a[0],a[1],a[2])||1; n.setXYZ(i,a[0]/l,a[1]/l,a[2]/l) } return g }
const dummy=new THREE.Object3D();
function instanced(geo,mat,items,tint){ const SEC=10, parts=[...Array(SEC)].map(()=>[]), col=new THREE.Color(); let first=null;
  items.forEach(it=>parts[Math.min(SEC-1,Math.floor((Math.atan2(it.z,it.x)+Math.PI)/TAU*SEC))].push(it));
  parts.forEach(list=>{ if(!list.length) return; const m=new THREE.InstancedMesh(geo,mat,list.length);
    list.forEach((it,i)=>{ dummy.position.set(it.x,it.y,it.z); dummy.rotation.set(it.rx||0,it.ry||0,it.rz||0); const sc=it.s||1; dummy.scale.set(sc*(it.sx||1),sc*(it.sy||1),sc*(it.sz||1)); dummy.updateMatrix(); m.setMatrixAt(i,dummy.matrix); if(tint||it.c){ col.set(it.c||tint); m.setColorAt(i,col) } });
    m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true; m.computeBoundingSphere(); m.boundingSphere.radius+=1.5; scene.add(m); first=first||m });
  return first }

/* ---------- light ---------- */
scene.add(new THREE.HemisphereLight(0xd8f6ff,0x4f8fa6,2.2));
const sun=new THREE.DirectionalLight(0xfff3d0,2.6); sun.position.copy(SUN).multiplyScalar(50); scene.add(sun);

/* ---------- seabed ---------- */
{ const g=new THREE.PlaneGeometry(440,440,250,250).rotateX(-Math.PI/2), p=g.attributes.position; for(let i=0;i<p.count;i++) p.setY(i,groundY(p.getX(i),p.getZ(i))); g.computeVertexNormals();
  const a=new THREE.Color(0xf1e2bb), b=new THREE.Color(0xcdb98c), rub=new THREE.Color(0x9c9484);
  paint(g,(c,x,y,z)=>{ c.copy(b).lerp(a,smooth(.3,.7,fbm2(x*.07,z*.07,3))); c.lerp(rub,siteNear(x,z)*.55) });
  scene.add(new THREE.Mesh(g,uw(new THREE.MeshLambertMaterial({vertexColors:true,map:detailTex(90),bumpMap:rippleTex,bumpScale:.9}),{key:'sand'}))) }

  blipT-=dt; if(blipT<=0){ blipT=2.5+Math.random()*4; const nb=3+((Math.random()*4)|0); for(let i=0;i<nb;i++) setTimeout(()=>blip(.1),i*70+Math.random()*40) }
}
let depthT=0;

let running=false, last=0, started=false, slow=0, frames=0;
